modules:
  rovo:mcp:
    - key: evidencedesk-mcp
      name: EvidenceDesk Compliance MCP
      tools:
        - check-control
        - run-audit
        - generate-evidence-pack
  rovo:agent:
    - key: evidencedesk-hello-world-agent
      name: EvidenceDesk
      description: >
        Compliance evidence assistant that checks Jira issues against
        deterministic controls and summarizes the structured results.
      prompt: >
        You are EvidenceDesk, a compliance audit assistant.

        Tool selection:
        - When the user asks to check a specific compliance control (e.g. C1, C2,
          C3, C4, or C5), call `check-control` with `controlId`.
        - When the user asks "are we audit ready", requests a full audit, or
          asks about overall compliance posture, call `run-audit`.
        - When the user asks to "generate the audit evidence pack", create an
          evidence pack page, or publish audit results to Confluence, call
          `generate-evidence-pack`.
        - If the user names a Jira project, pass its key as `projectKey`. If
          the user names a Confluence space, pass its key as `spaceKey`.

        Rules:
        - Call each action at most once per user request. Never call
          `generate-evidence-pack` again after it returns, even if the answer
          seems slow. Do not retry on your own; if an action returns an error,
          say so and quote its exact reason.
        - Never invent, guess, or extrapolate issue keys, page titles, statuses,
          assignees, resolutions, counts, dates, or URLs.
        - Use control titles only from the returned JSON. If a control has
          status "error", say it errored and quote its `reason`; never describe
          what a control checks beyond what the JSON says.
        - Base your explanation strictly on the JSON returned by the action.
        - For `run-audit`, start with a short executive summary (overall
          counts/status and controls checked), then list failing items with
          clickable links (`url`) and exact failure reasons, then note any
          controls with `missing_evidence` or `error`.
        - For `generate-evidence-pack`, reply with the executive summary, the
          Confluence space used (`spaceKey`), and the exact clickable `pageUrl`
          returned by the action. Never invent a link.
      conversationStarters:
        - Are we audit ready? Run full compliance audit
        - Generate the audit evidence pack
        - Run compliance check C1 on Jira Done issues
      actions:
        - check-control
        - run-audit
        - generate-evidence-pack
  action:
    - key: check-control
      name: Check compliance control
      function: checkControl
      actionVerb: GET
      description: >
        Evaluate one deterministic compliance control (C1-C5) and return
        pass/fail/missing_evidence JSON with links. Pass projectKey (e.g. "ED")
        to scope Jira checks to one project, or omit for all projects.
      inputs:
        controlId:
          title: Control ID
          type: string
          required: true
          description: The compliance control ID to check (C1, C2, C3, C4, or C5).
        projectKey:
          title: Jira Project Key
          type: string
          required: false
          description: >
            Optional Jira project key (e.g. "ED", matching ^[A-Z][A-Z0-9_]+$) to
            scope Jira queries to one project. Omit to check all projects.
    - key: run-audit
      name: Run full compliance audit
      function: runAudit
      actionVerb: GET
      description: >
        Run all compliance controls (C1-C5) in parallel for overall audit
        readiness. Returns summary counts and per-control results. Pass
        projectKey (e.g. "ED") to scope Jira checks, or omit for all projects.
      inputs:
        projectKey:
          title: Jira Project Key
          type: string
          required: false
          description: >
            Optional Jira project key (e.g. "ED", matching ^[A-Z][A-Z0-9_]+$) to
            scope Jira controls to one project. Omit to audit all projects.
    - key: generate-evidence-pack
      name: Generate audit evidence pack
      function: generateEvidencePack
      actionVerb: CREATE
      description: >
        Run all controls (C1-C5) and publish a Confluence Audit Evidence Pack
        page (5-min dedupe). Returns pageUrl, pageId, spaceKey, summary. Pass
        projectKey to scope Jira, and spaceKey for the target Confluence space.
      inputs:
        spaceKey:
          title: Confluence Space Key
          type: string
          required: false
          description: >
            Optional Confluence space key where the evidence pack page should be
            created. If omitted, uses the first writable space.
        projectKey:
          title: Jira Project Key
          type: string
          required: false
          description: >
            Optional Jira project key (e.g. "ED", matching ^[A-Z][A-Z0-9_]+$) to
            scope Jira controls to one project. Omit to audit all projects.
  function:
    - key: checkControl
      handler: index.checkControl
    - key: runAudit
      handler: index.runAudit
    - key: generateEvidencePack
      handler: index.generateEvidencePack
permissions:
  scopes:
    - read:jira-work
    - search:confluence
    - read:page:confluence
    - read:space:confluence
    - write:page:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/6e91cdf2-96d1-48a2-ac13-4eace341769d
